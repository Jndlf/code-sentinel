name: CI

# Zweite Verteidigungslinie: prüft auch Commits, die ohne lokalen Hook entstanden sind.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Keine Reports, Findings, Audit-Logs oder Secrets im Repo
        run: sh scripts/guard.sh --all

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Offline-Tests
        run: |
          pip install -r requirements.txt
          pytest -q tests
